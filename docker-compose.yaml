# ============================================================
# Ambiente do Hackathon Vint_Global
# ============================================================

name: hackathon

services:
  # PostgreSQL 18
  postgres:
    image: postgres:18-alpine
    container_name: hackathon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     hackathon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       hackathon
      TZ: America/Sao_Paulo
    ports:
     # Se a porta 5432 já estiver em uso, troque só o número da ESQUERDA
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # pgAdmin 4 
  pgadmin:
    image: dpage/pgadmin4
    container_name: hackathon-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy 
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@hackathon.com
      PGADMIN_DEFAULT_PASSWORD: hackathon
      PGADMIN_CONFIG_SERVER_MODE:           "False"  
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"  
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      # Se a porta 5050 já estiver em uso, troque só o número da ESQUERDA
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  pgadmin_data:
